# Apache Configuration for HireSmart Two-Domain Setup
# Place in: /etc/apache2/sites-available/

# ============================================
# Landing Page: hiresmart.startupstreet.in
# ============================================

<VirtualHost *:80>
    ServerName hiresmart.startupstreet.in
    ServerAlias www.hiresmart.startupstreet.in
    
    DocumentRoot /var/www/hiresmart
    
    <Directory /var/www/hiresmart>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # WordPress permalinks
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.php$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
        </IfModule>
    </Directory>
    
    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
    
    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/hiresmart_error.log
    CustomLog ${APACHE_LOG_DIR}/hiresmart_access.log combined
    
    # Redirect to HTTPS (will be added by Certbot)
    # RewriteEngine on
    # RewriteCond %{SERVER_NAME} =hiresmart.startupstreet.in [OR]
    # RewriteCond %{SERVER_NAME} =www.hiresmart.startupstreet.in
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# SSL configuration (added by Certbot)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hiresmart.startupstreet.in
    ServerAlias www.hiresmart.startupstreet.in
    
    DocumentRoot /var/www/hiresmart
    
    <Directory /var/www/hiresmart>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Security headers
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
    
    ErrorLog ${APACHE_LOG_DIR}/hiresmart_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/hiresmart_ssl_access.log combined
    
    # SSL Certificate files (added by Certbot)
    # SSLCertificateFile /etc/letsencrypt/live/hiresmart.startupstreet.in/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/hiresmart.startupstreet.in/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

# ============================================
# App Dashboard: app-hiresmart.startupstreet.in
# ============================================

<VirtualHost *:80>
    ServerName app-hiresmart.startupstreet.in
    
    DocumentRoot /var/www/app-hiresmart
    
    <Directory /var/www/app-hiresmart>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # WordPress permalinks
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.php$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
        </IfModule>
    </Directory>
    
    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
        
        # Allow CORS from landing page
        Header set Access-Control-Allow-Origin "https://hiresmart.startupstreet.in"
        Header set Access-Control-Allow-Credentials "true"
    </IfModule>
    
    ErrorLog ${APACHE_LOG_DIR}/app_hiresmart_error.log
    CustomLog ${APACHE_LOG_DIR}/app_hiresmart_access.log combined
    

# ============================================
# Installation Instructions
# ============================================

# 1. Copy this file to Apache sites-available:
#    sudo cp apache-vhosts.conf /etc/apache2/sites-available/hiresmart.conf

# 2. Enable required Apache modules:
#    sudo a2enmod rewrite
#    sudo a2enmod ssl
#    sudo a2enmod headers

# 3. Enable the site:
#    sudo a2ensite hiresmart

# 4. Test configuration:
#    sudo apache2ctl configtest

# 5. Reload Apache:
#    sudo systemctl reload apache2

# 6. Install SSL certificates:
#    sudo certbot --apache -d hiresmart.startupstreet.in -d app-hiresmart.startupstreet.in

# ============================================
# Installation Instructions
# ============================================

# 1. Copy this file to Nginx sites-available:
#    sudo cp nginx-vhosts.conf /etc/nginx/sites-available/hiresmart

# 2. Create symbolic link to sites-enabled:
#    sudo ln -s /etc/nginx/sites-available/hiresmart /etc/nginx/sites-enabled/

# 3. Test Nginx configuration:
#    sudo nginx -t

# 4. Reload Nginx:
#    sudo systemctl reload nginx

# 5. Install SSL certificates:
#    sudo certbot --nginx -d hiresmart.startupstreet.in -d app-hiresmart.startupstreet.in
